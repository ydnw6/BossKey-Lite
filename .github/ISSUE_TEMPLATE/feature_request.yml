name: 💡 功能建议
description: 提出新功能或改进现有功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        轻享版的定位是**小巧、免费、只做好一键隐藏**。防录屏/防截屏、隐藏托盘图标、隐藏悬浮窗等属于完整版功能，不会加入本仓库，这类建议请不要在这里提。

  - type: textarea
    id: problem
    attributes:
      label: 遇到的问题 / 使用场景
      description: 你在什么场景下觉得不够用？先说问题，再说方案
      placeholder: 我经常同时开好几个浏览器窗口，只想隐藏其中一个……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望的功能
      description: 你希望它怎么工作？界面上怎么操作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
      description: 有没有现在就能凑合用的办法，或者别的软件是怎么做的
    validations:
      required: false

  - type: dropdown
    id: importance
    attributes:
      label: 对你有多重要
      options:
        - 有了更好
        - 比较需要
        - 没有就用不了
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意提交 Pull Request 来实现它
        - label: 我已搜索过已有 Issue，没有重复
          required: true
