name: 🐞 Bug 反馈
description: 软件出错、隐藏/恢复不正常、闪退等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先：
        - 确认用的是 [最新版](https://github.com/jiongjiong123441/BossKey-Lite/releases/latest)；
        - 在 [已有 Issue](https://github.com/jiongjiong123441/BossKey-Lite/issues?q=is%3Aissue) 里搜一下是否已经有人报过。

  - type: input
    id: version
    attributes:
      label: 软件版本
      description: exe 右键 → 属性 → 详细信息 → 产品版本；或下载的文件名，如 BossKey-Lite-v1.3.15.exe
      placeholder: v1.3.15
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 从哪里获得的
      options:
        - 本仓库 Releases 下载
        - 官网 bosskey.pages.dev 下载
        - 自己从源码编译
        - 其他渠道（请在下方说明）
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Windows 版本
      description: Win + R 输入 winver 查看
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options:
        - 按老板键没反应 / 快捷键无效
        - 窗口隐藏不了或隐藏不全
        - 恢复后窗口没回来 / 位置不对
        - 隐身时静音 / 暂停不生效
        - 闪退 / 报错 / 卡顿
        - 界面显示问题（模糊、错位、缩放）
        - 开机自启 / 托盘问题
        - 其他
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 要隐藏的程序
      description: 出问题的目标程序名称和版本（如 chrome.exe 131、微信 4.0、某游戏）
      placeholder: chrome.exe
    validations:
      required: false

  - type: checkboxes
    id: env
    attributes:
      label: 运行环境
      description: 符合的都勾上
      options:
        - label: 一键隐身是以管理员身份运行的
        - label: 目标程序是以管理员身份运行的
        - label: 使用了多显示器
        - label: 系统缩放不是 100%
        - label: 同时运行了其他老板键/窗口管理类软件

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体，让别人照着做能看到同样的问题
      placeholder: |
        1. 在「选择程序…」里勾选 chrome.exe
        2. 打开一个正在播放视频的网页
        3. 按 Ctrl + Alt + Q
        4. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际的结果
      description: 可以直接粘贴截图或录屏（拖进输入框即可）
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 日志（强烈建议）
      description: |
        1. 打开 `%AppData%\MoyuBossKeyLite`，新建一个空文件 `debug.on`；
        2. 重启一键隐身，复现问题；
        3. **在下次启动之前**把同目录下的 `log.txt` 内容粘贴到这里（每次启动会清空日志）。
        日志只含进程名和操作记录，不含窗口内容；粘贴前可自行检查删减。
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 其他补充
      description: 是否每次都出现、从哪个版本开始出现、你已经尝试过什么
    validations:
      required: false
