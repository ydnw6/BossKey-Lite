name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BossKey-Lite
          path: dist/BossKey-Lite.exe

      # 推送 v* 标签时发布 Release：BossKey-Lite.exe 作为固定直链，另附带版本号的副本
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Copy-Item dist/BossKey-Lite.exe "dist/BossKey-Lite-${{ github.ref_name }}.exe"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/BossKey-Lite.exe
            dist/BossKey-Lite-${{ github.ref_name }}.exe
